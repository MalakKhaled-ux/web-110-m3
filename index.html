<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Search</title>
</head>
<body>
    <header>
        <h1>Apartment Search</h1>
    </header>
<main>
    <form action="#" method="GET">
        <div>
          <label for="location">Location:</label>  
          <input type="text" name="location" id="location"/>
        </div>
        <br/>

        <div>
          <label for="price">Price:</label>  
          <input type="range" name="price" id="price" min="0" max="5000" step="100"/>
        </div>
        <br/>

        <div>
          <label for="bedrooms">Bedrooms:</label>  
          <input type="number" name="bedrooms" id="bedrooms" min="0"/>
        </div>
        <br/>

        <div>
          <label for="bathrooms">Bathrooms:</label>  
          <input type="number" name="bathrooms" id="bathrooms" min="0" step="0.5"/>
        </div>
        <br/>

        <div>
          <label for="pets">Pets Allowed:</label>
          <input type="checkbox" name="pets" id="pets"/>
            </label>
        </div>
        <br/>
        <div>
            <label for="Date">Date Available:</label>
            <input type="Date" name="Date" id="Date"/>
        </div>
        <br/>
        <div>
            <input type="submit" value="submit"/>
        </div>


    </form>
</main>
</body>
</html>
